name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  python-docs:
    runs-on: ubuntu-latest
    # One build per Python version pyproject.toml claims to support. The set is
    # not free to drift from that claim: tests/test_ci_workflows.py reads the
    # `Programming Language :: Python :: 3.x` classifiers and the
    # `requires-python` bounds and requires this matrix to equal them exactly,
    # so a version declared here and nowhere else -- or supported in the
    # metadata and built nowhere -- is a red test rather than a promise nobody
    # keeps. fail-fast is off so a failure on one version still reports the
    # other; nothing is skipped either way.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # Unconditionally locked. This step used to fall back to a plain
      # `uv sync` when uv.lock was absent, which answers the one situation
      # --locked exists to catch by resolving a dependency tree no checkout has
      # and reporting green. A missing or stale lockfile must fail the job.
      - name: Sync
        run: uv sync --locked --all-groups
      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Test
        run: uv run --group docs pytest --cov=quviz --cov-report=term-missing
      - name: Build documentation
        run: |
          uv run --group docs python scripts/render_reference_index.py --check
          uv run --group docs python scripts/render_openapi_reference.py --check
          uv run --group docs mkdocs build --strict

  changed-links:
    # A link being *introduced* has to be shown to resolve: BROKEN and SUSPECT
    # verdicts fail. BLOCKED -- a 401/403 from a known bot-filter host, or a
    # 429 rate limit from any host -- says nothing about the link and is
    # tolerated here exactly as in the weekly sweep (cite bot-filter hosts by
    # DOI so something is verified). Rot in links that already exist is the
    # weekly link-check workflow's job, not the author's. This repository
    # merges by fast-forward push, so the job runs on push as well as on
    # pull_request. The base is the PR's base branch, or the commit the push
    # moved the ref away from; when that commit is unusable -- the zero SHA on
    # a branch's first push, or no ancestor of HEAD after a force push -- the
    # base falls back to origin/master, so the probe covers everything the
    # branch adds over master rather than being skipped. When even that base
    # already contains HEAD (the first or a force push of master itself:
    # origin/master *is* HEAD, so a diff against it is empty) or there is no
    # origin/master at all, there is nothing to diff against and the step asks
    # for a sweep of every cited URL and DOI instead -- the weekly job's probe,
    # run now. Nothing in this job is skipped. tests/test_check_script.py
    # executes the base and probe steps' scripts against throwaway
    # repositories and a stub uv.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # --changed-since diffs against the merge base with the base revision.
          fetch-depth: 0
      - name: Resolve the base revision
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          usable() {
            [ -n "$1" ] \
              && [ "$1" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$1^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$1" HEAD
          }
          sweep() {
            echo "$1; probing every cited URL and DOI instead"
            echo "sweep=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
            git cat-file -e "$base^{commit}" 2>/dev/null \
              || { echo "base branch $base is not in this checkout"; exit 1; }
          elif usable "$BEFORE"; then
            base="$BEFORE"
          elif git cat-file -e "origin/master^{commit}" 2>/dev/null; then
            echo "push base '$BEFORE' is unusable (first push of the branch, or a force push);" \
                 "falling back to the merge base with origin/master"
            base="origin/master"
          else
            sweep "push base '$BEFORE' is unusable and origin/master does not exist: nothing to diff against"
          fi
          if git merge-base --is-ancestor HEAD "$base"; then
            sweep "base $base already contains HEAD (a first or force push of the base branch itself): nothing to diff against"
          fi
          echo "using base $base ($(git rev-parse --short "$base"))"
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync
        run: uv sync --locked --all-groups
      - name: Probe links added since the base revision (or every cited link)
        env:
          BASE: ${{ steps.base.outputs.ref }}
          SWEEP: ${{ steps.base.outputs.sweep }}
        run: |
          if [ "$SWEEP" = "true" ]; then
            uv run --group docs python scripts/check_links.py --include-doi
          else
            uv run --group docs python scripts/check_links.py --changed-since "$BASE"
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
      # `npm ci`, never `npm install`: the lockfile is the dependency tree
      # under test, and the fallback this step used to carry made a missing
      # package-lock.json a fresh resolution instead of a failure.
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run build

  web-fullstack:
    # Unlike the fixture-backed visual suite below, this job crosses the real
    # production boundary: build the SPA, start the documented `quviz serve`
    # command, let FastAPI mount web/dist, and drive the scientific routes from
    # Chromium without intercepting /api. The same Playwright run starts strict
    # MkDocs on an isolated port and checks MathJax after instant navigation,
    # Mermaid SVG output, Python API inventory, and citation anchors. Keep it
    # separate so a failure names the integration layer rather than a unit test.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
      # Match the repository-wide locked-environment contract. Playwright then
      # starts the already-synchronised environment with --no-sync so the web
      # server cannot mutate the lock or environment behind the job's back.
      - name: Sync backend runtime
        run: uv sync --locked --all-groups
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install the pinned browser
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:fullstack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fullstack-playwright-report
          path: |
            web/playwright-report/fullstack
            web/test-results/fullstack
          retention-days: 7

  web-visual:
    # The screenshot suite, and the ONLY place it can run. web/playwright
    # .config.ts throws at module load off Linux, on purpose: the baselines in
    # web/e2e/__screenshots__ are SwiftShader's pixels on this runner image, and
    # every other platform renders different ones -- so a developer reaching for
    # `--update-snapshots` after a red local run would overwrite the CI
    # baselines with their own machine's rendering and leave the suite green
    # locally, red here, and describing no regression at all. Nothing in
    # check.ps1 or `npm run test` covers any of this.
    #
    # A separate job from `web` rather than two more steps of it: this one
    # downloads a browser and system libraries the unit-test job has no use for,
    # and a red pixel diff has to read as "the picture changed" rather than as
    # "the front-end gates failed". tests/test_check_script.py pins the job's
    # existence, its runner, its working directory, both installs, the gate step
    # and the artefact upload, because deleting the job is cheaper than
    # defeating any one of them and nothing else in the repository reads it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
      # `npm ci`, never `npm install`, for the reason given in the `web` job --
      # and one more here: a pixel diff must be an argument about rendering, so
      # the tree that draws it has to be the tree package-lock.json describes.
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      # `--no-install` makes npx refuse to fetch a *different* Playwright from
      # the registry if the local one is missing. Browser binaries are bundled
      # per Playwright version (which is why package.json pins @playwright/test
      # exactly, with no caret), so without it a broken install would silently
      # compare this tree's rendering against baselines drawn by a Chromium it
      # never used. `--with-deps` installs the shared libraries headless
      # Chromium needs; `chromium` alone because playwright.config.ts drives no
      # other browser.
      - name: Install the pinned browser
        run: npx --no-install playwright install --with-deps chromium
      # `playwright test` and then scripts/assert-visual-run.mjs, which is what
      # makes the exit code mean something: Playwright exits 0 for a run in
      # which every test was skipped, for one that collected no spec at all, and
      # for one launched with --update-snapshots (which writes the baselines it
      # was asked to compare against).
      - run: npm run test:visual
      # The only step that may carry an `if:`, and only in the safe direction: a
      # failed comparison prints a pixel count into the log and nothing else,
      # while the actual/expected/diff PNGs and the HTML report exist only on
      # the runner. `failure()` rather than `always()` -- `always()` also fires
      # on a cancelled job and uploads a half-written report. Paths are
      # repository-relative because `defaults.run.working-directory` applies to
      # `run:` steps only, never to a `uses:` step's inputs.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
